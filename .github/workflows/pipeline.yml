name: Pipeline

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Build ────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  # ── 2. Deploy → Dev ─────────────────────────────────────────────────────────
  deploy-dev:
    name: Deploy → Dev
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (dev)
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          preview: true

  # ── 3. Deploy → Production ──────────────────────────────────────────────────
  deploy-prod:
    name: Deploy → Production
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://victord-ef.github.io/DeployCraft-DnsLookup/
    steps:
      - name: Deploy to GitHub Pages (production)
        id: deploy
        uses: actions/deploy-pages@v4
